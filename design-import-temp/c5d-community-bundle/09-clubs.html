<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Book clubs — Beehive Studio</title>
<link rel="stylesheet" href="community.css" />
</head>
<body>
<main class="cm-main">
<div class="cm-wrap w-5xl" data-screen-label="Clubs index">
  <div class="route-tag"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>/clubs</div>

  <div class="page-head"><div class="head-row">
    <div><h1>Book clubs</h1></div>
    <button class="btn-brand" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg>New Club</button>
  </div></div>

  <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;">
    <h2 style="font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--canvas-dark-ink-strong);margin:0;">My clubs</h2>
    <span class="count meta-mono">2 joined</span>
  </div>

  <div class="grid-3">
    <a class="ccard" href="#">
      <div class="cc-cover cover-grad" style="--pt:var(--status-outline)"><div class="cc-pills"><span class="pill vis-public"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10z"/></svg>Public</span><span class="pill open-join"><span class="dot"></span>Open</span></div></div>
      <div class="cc-body"><h3 class="cc-title">The Midnight Chapter</h3>
        <div class="tag-row"><span class="tag">Mystery</span><span class="tag">Thriller</span></div>
        <p class="cc-reading">📖 Reading <i>The Hollow King</i></p>
        <div class="cc-foot"><span class="owner-card"><span class="avatar s24 a-lilac">EM</span><span class="oc-handle">@emery.makes</span></span><div class="cc-stats"><span class="cc-stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>14</span></div></div></div>
    </a>
    <a class="ccard" href="#">
      <div class="cc-cover cover-grad" style="--pt:var(--status-revised)"><div class="cc-pills"><span class="pill vis-friends"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>Friends</span><span class="pill role-mod"><span class="dot"></span>Mod</span></div></div>
      <div class="cc-body"><h3 class="cc-title">Slow Reads Society</h3>
        <div class="tag-row"><span class="tag">Literary</span><span class="tag">Classics</span></div>
        <p class="cc-reading">📖 Reading <i>Saltwater Hours</i></p>
        <div class="cc-foot"><span class="owner-card"><span class="avatar s24 a-coral">JW</span><span class="oc-handle">@june.writes</span></span><div class="cc-stats"><span class="cc-stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>8</span></div></div></div>
    </a>
  </div>

  <div style="text-align:center;margin-top:20px;"><a href="#" style="font-family:var(--font-mono);font-size:12px;color:var(--brand);text-decoration:none;">Discover more clubs →</a></div>
</div>
</main>
</body>
</html>
