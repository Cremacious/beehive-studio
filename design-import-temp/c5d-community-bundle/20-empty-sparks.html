<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sparks — Beehive Studio</title>
<link rel="stylesheet" href="community.css" />
</head>
<body>
<main class="cm-main">
<div class="cm-wrap w-5xl" data-screen-label="Empty — no active sparks">
  <div class="route-tag"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>/sparks</div>

  <div class="page-head"><div class="head-row">
    <div><h1>Sparks</h1></div>
    <button class="btn-brand" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg>New Spark</button>
  </div></div>

  <div style="margin-bottom:14px;" class="eyebrow-mono">Accepting entries</div>
  <section class="panel">
    <div class="empty" style="padding:56px 28px;">
      <span class="glyph" style="width:80px;height:80px;border-radius:24px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg></span>
      <h2 style="font-size:22px;">No active sparks</h2>
      <p>Be the first to start one. Write a prompt, set a deadline, and see what the community comes up with.</p>
      <div class="cta-row">
        <button class="btn-brand" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg>New Spark</button>
      </div>
    </div>
  </section>
</div>
</main>
</body>
</html>
