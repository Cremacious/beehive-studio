<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>Community — Beehive Studio</title>
<link rel="stylesheet" href="community.css" />
</head>
<body>
<main class="cm-main">
<div class="cm-wrap w-5xl" data-screen-label="Empty — community feed">
  <div class="route-tag"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>/community</div>
  <section class="panel">
    <div class="empty">
      <span class="glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
      <h2>Your feed is quiet for now</h2>
      <p>Follow some writers and join a hive — once you've got friends, their new chapters, sparks, and lists will show up right here.</p>
      <div class="cta-row">
        <button class="btn-brand" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>Find friends</button>
        <button class="btn-tile" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2 L20 6.5 L20 15.5 L12 20 L4 15.5 L4 6.5 Z"/></svg>Discover hives</button>
      </div>
    </div>
  </section>
</div>
</main>
