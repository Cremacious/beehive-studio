<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Reset password — Beehive Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#141414', card: '#1c1c1c', elev: '#252525', inset: '#1e1e1e',
          line: '#2a2a2a', brand: '#FFC300', brandHi: '#FFD040', brandLo: '#e0ac01',
        },
        fontFamily: {
          display: ['Comfortaa', 'sans-serif'],
          sans: ['Geist', 'ui-sans-serif', 'system-ui', 'sans-serif'],
        },
        borderRadius: { xl: '14px', '2xl': '18px', '3xl': '22px' },
      }
    }
  }
</script>
<style>
  html, body { background: #141414; color: white; }
  body { font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .font-display { font-family: 'Comfortaa', sans-serif; }

  .paper-stack {
    border: 1px solid #2a2a2a;
    border-bottom-color: #111;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.04) inset,
      0 3px 0 rgba(0,0,0,0.32),
      0 40px 80px -40px rgba(0,0,0,0.6);
  }

  .hex-bg {
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='52' viewBox='0 0 60 52'><path d='M15 1 L45 1 L60 26 L45 51 L15 51 L0 26 Z' fill='none' stroke='%23FFC300' stroke-opacity='0.08' stroke-width='1'/></svg>");
    background-size: 60px 52px;
  }

  .auth-glow {
    background:
      radial-gradient(ellipse 50% 40% at 50% 30%, rgba(255,195,0,0.10), transparent 60%),
      radial-gradient(ellipse 60% 40% at 50% 80%, rgba(255,195,0,0.04), transparent 60%);
  }

  .field {
    background: #252525; border: 1px solid #2a2a2a; color: white;
    border-radius: 14px; padding: 14px 16px; width: 100%;
    transition: border-color .15s, box-shadow .15s, background-color .15s;
    font-size: 15px;
  }
  .field::placeholder { color: rgba(255,255,255,0.3); }
  .field:focus { outline: none; border-color: rgba(255,195,0,0.5); box-shadow: 0 0 0 4px rgba(255,195,0,0.12); }

  .btn-primary {
    background: #FFC300; color: #0a0a0a; font-weight: 700; font-family: 'Comfortaa', sans-serif;
    transition: background-color .15s ease, transform .15s ease, box-shadow .15s ease;
    box-shadow: 0 6px 24px -10px rgba(255,195,0,0.55);
  }
  .btn-primary:hover { background: #FFD040; transform: translateY(-1px); }
  .btn-primary:active { background: #e0ac01; transform: translateY(0); }

  .link-brand { color: #FFC300; }
  .link-brand:hover { text-decoration: underline; text-underline-offset: 4px; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #FFC300; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* Success state */
  .success-ring {
    animation: successPulse 2s ease-out infinite;
  }
  @keyframes successPulse {
    0% { box-shadow: 0 0 0 0 rgba(255,195,0,0.3); }
    70% { box-shadow: 0 0 0 12px rgba(255,195,0,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,195,0,0); }
  }
</style>
</head>
<body class="min-h-screen flex flex-col">

<!-- Backdrop -->
<div class="fixed inset-0 hex-bg opacity-50 pointer-events-none [mask-image:radial-gradient(ellipse_60%_50%_at_50%_40%,black,transparent_75%)]"></div>
<div class="fixed inset-0 auth-glow pointer-events-none"></div>

<!-- Top bar -->
<header class="relative z-10">
  <div class="max-w-7xl mx-auto px-6 lg:px-8 h-16 flex items-center justify-between">
    <a href="Landing Page.html" class="flex items-center gap-2.5">
      <span class="relative inline-flex items-center justify-center w-9 h-9 rounded-xl bg-brand/15 border border-brand/30">
        <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="#FFC300" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 L20 6.5 L20 15.5 L12 20 L4 15.5 L4 6.5 Z"/>
          <path d="M12 9 L16 11 L16 14.5 L12 16.5 L8 14.5 L8 11 Z" fill="#FFC300" fill-opacity="0.6" stroke="none"/>
        </svg>
      </span>
      <span class="font-display font-bold text-[17px] tracking-tight">Beehive Studio</span>
    </a>
    <a href="#" class="text-sm text-white/60 hover:text-white">Need help?</a>
  </div>
</header>

<!-- Main -->
<main class="relative z-10 flex-1 flex items-center justify-center px-6 py-10">
  <div class="w-full max-w-md">
    <!-- Card -->
    <div id="resetCard" class="paper-stack bg-card rounded-2xl p-8 sm:p-10">
      <!-- Back link -->
      <a href="Sign In.html" class="inline-flex items-center gap-2 text-[13.5px] text-white/60 hover:text-white transition-colors mb-7 group">
        <svg viewBox="0 0 24 24" class="w-4 h-4 transition-transform group-hover:-translate-x-0.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
        </svg>
        Back to sign in
      </a>

      <!-- Default state -->
      <div id="formState">
        <div class="mb-7">
          <span class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-brand/15 border border-brand/30 mb-5">
            <svg viewBox="0 0 24 24" class="w-6 h-6 text-brand" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="16" x="2" y="4" rx="2"/>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
          </span>
          <h1 class="font-display font-bold text-[28px] leading-tight">Reset your password</h1>
          <p class="text-white/55 text-[14.5px] mt-2.5 leading-relaxed">Enter your email and we'll send you a reset link.</p>
        </div>

        <form id="resetForm" class="space-y-4" onsubmit="event.preventDefault(); handleSubmit();">
          <div>
            <label for="email" class="block text-[13px] font-medium text-white/80 mb-1.5">Email</label>
            <input id="email" type="email" autocomplete="email" required placeholder="you@example.com" class="field" />
          </div>

          <button type="submit" class="btn-primary rounded-full w-full px-5 py-3.5 text-[15px] inline-flex items-center justify-center gap-2 mt-2">
            Send reset link
            <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </button>
        </form>
      </div>

      <!-- Success state (hidden by default) -->
      <div id="successState" class="hidden">
        <div class="text-center">
          <span class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-brand/15 border border-brand/30 mb-6 success-ring">
            <svg viewBox="0 0 24 24" class="w-7 h-7 text-brand" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 6 9 17l-5-5"/>
            </svg>
          </span>
          <h2 class="font-display font-bold text-[24px] leading-tight">Check your inbox</h2>
          <p class="text-white/55 text-[14.5px] mt-2.5 leading-relaxed">
            We sent a reset link to<br/>
            <span id="sentEmail" class="text-white font-medium">—</span>
          </p>
          <p class="text-white/40 text-[13px] mt-4 leading-relaxed">
            Didn't get it? Check your spam folder or
            <button onclick="resetToForm()" class="link-brand">try again</button>.
          </p>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Footer -->
<footer class="relative z-10 py-6">
  <div class="max-w-7xl mx-auto px-6 lg:px-8 flex flex-wrap items-center justify-between gap-3 text-[12px] text-white/40">
    <div>&copy; 2026 Beehive Studio</div>
    <div class="flex items-center gap-5">
      <a href="#" class="hover:text-white/70">Privacy</a>
      <a href="#" class="hover:text-white/70">Terms</a>
      <span class="flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-green-400"></span>
        All systems honey
      </span>
    </div>
  </div>
</footer>

<script>
  function handleSubmit() {
    const email = document.getElementById('email').value;
    if (!email) return;
    document.getElementById('sentEmail').textContent = email;
    document.getElementById('formState').classList.add('hidden');
    document.getElementById('successState').classList.remove('hidden');
  }

  function resetToForm() {
    document.getElementById('formState').classList.remove('hidden');
    document.getElementById('successState').classList.add('hidden');
    document.getElementById('email').value = '';
    document.getElementById('email').focus();
  }
</script>

</body>
</html>
