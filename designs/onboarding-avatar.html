
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Add a profile photo — Beehive Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#141414', card: '#1c1c1c', elev: '#252525', inset: '#1e1e1e',
          line: '#2a2a2a', brand: '#FFC300', brandHi: '#FFD040', brandLo: '#e0ac01',
        },
        fontFamily: {
          display: ['Comfortaa', 'sans-serif'],
          sans: ['Geist', 'ui-sans-serif', 'system-ui', 'sans-serif'],
        },
        borderRadius: { xl: '14px', '2xl': '18px', '3xl': '22px' },
      }
    }
  }
</script>
<style>
  html, body { background: #141414; color: white; }
  body { font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .font-display { font-family: 'Comfortaa', sans-serif; }

  .paper-stack {
    border: 1px solid #2a2a2a;
    border-bottom-color: #111;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.04) inset,
      0 3px 0 rgba(0,0,0,0.32),
      0 40px 80px -40px rgba(0,0,0,0.6);
  }

  .hex-bg {
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='52' viewBox='0 0 60 52'><path d='M15 1 L45 1 L60 26 L45 51 L15 51 L0 26 Z' fill='none' stroke='%23FFC300' stroke-opacity='0.08' stroke-width='1'/></svg>");
    background-size: 60px 52px;
  }

  .auth-glow {
    background:
      radial-gradient(ellipse 50% 40% at 50% 30%, rgba(255,195,0,0.10), transparent 60%),
      radial-gradient(ellipse 60% 40% at 50% 80%, rgba(255,195,0,0.04), transparent 60%);
  }

  .btn-primary {
    background: #FFC300; color: #0a0a0a; font-weight: 700; font-family: 'Comfortaa', sans-serif;
    transition: background-color .15s ease, transform .15s ease, box-shadow .15s ease;
    box-shadow: 0 6px 24px -10px rgba(255,195,0,0.55);
  }
  .btn-primary:hover { background: #FFD040; transform: translateY(-1px); }
  .btn-primary:active { background: #e0ac01; transform: translateY(0); }

  .btn-ghost {
    background: transparent; color: rgba(255,255,255,0.55); font-weight: 500;
    font-family: 'Comfortaa', sans-serif;
    transition: color .15s, background-color .15s;
  }
  .btn-ghost:hover { color: white; background: rgba(255,255,255,0.05); }

  .avatar-zone {
    width: 140px; height: 140px;
    border-radius: 9999px;
    background: #252525;
    border: 2px dashed #2a2a2a;
    cursor: pointer;
    transition: border-color .2s, background-color .2s, box-shadow .2s, transform .15s;
    position: relative;
    overflow: hidden;
  }
  .avatar-zone:hover {
    border-color: rgba(255,195,0,0.5);
    background: #2a2a2a;
    transform: scale(1.02);
  }
  .avatar-zone:focus-visible {
    outline: none;
    border-color: rgba(255,195,0,0.5);
    box-shadow: 0 0 0 4px rgba(255,195,0,0.12);
  }
  .avatar-zone.has-photo {
    border-style: solid;
    border-color: rgba(255,195,0,0.4);
    box-shadow: 0 0 0 4px rgba(255,195,0,0.08);
  }
  .avatar-zone.has-photo:hover {
    border-color: rgba(255,195,0,0.6);
  }

  .avatar-img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 9999px;
  }

  .avatar-overlay {
    position: absolute; inset: 0;
    border-radius: 9999px;
    background: rgba(0,0,0,0.5);
    opacity: 0;
    transition: opacity .2s;
    display: flex; align-items: center; justify-content: center;
  }
  .avatar-zone.has-photo:hover .avatar-overlay {
    opacity: 1;
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #FFC300; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body class="min-h-screen flex flex-col">

<!-- Backdrop -->
<div class="fixed inset-0 hex-bg opacity-50 pointer-events-none [mask-image:radial-gradient(ellipse_60%_50%_at_50%_40%,black,transparent_75%)]"></div>
<div class="fixed inset-0 auth-glow pointer-events-none"></div>

<!-- Top bar -->
<header class="relative z-10">
  <div class="max-w-7xl mx-auto px-6 lg:px-8 h-16 flex items-center justify-between">
    <a href="Landing Page.html" class="flex items-center gap-2.5">
      <span class="relative inline-flex items-center justify-center w-9 h-9 rounded-xl bg-brand/15 border border-brand/30">
        <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="#FFC300" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 L20 6.5 L20 15.5 L12 20 L4 15.5 L4 6.5 Z"/>
          <path d="M12 9 L16 11 L16 14.5 L12 16.5 L8 14.5 L8 11 Z" fill="#FFC300" fill-opacity="0.6" stroke="none"/>
        </svg>
      </span>
      <span class="font-display font-bold text-[17px] tracking-tight">Beehive Studio</span>
    </a>
    <span class="text-sm text-white/40">Step 3 of 3</span>
  </div>
</header>

<!-- Main -->
<main class="relative z-10 flex-1 flex items-center justify-center px-6 py-10">
  <div class="w-full max-w-md">

    <!-- Progress indicator -->
    <div class="flex items-center gap-2 mb-8 px-1">
      <!-- Step 1 — completed -->
      <div class="flex items-center gap-2.5 flex-1">
        <span class="w-7 h-7 rounded-full bg-brand/20 border border-brand/40 flex items-center justify-center shrink-0">
          <svg viewBox="0 0 24 24" class="w-4 h-4 text-brand" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </span>
        <span class="text-[13px] text-white/50">Username</span>
      </div>
      <div class="h-px flex-1 bg-brand/30 max-w-[40px]"></div>
      <!-- Step 2 — completed -->
      <div class="flex items-center gap-2.5 flex-1">
        <span class="w-7 h-7 rounded-full bg-brand/20 border border-brand/40 flex items-center justify-center shrink-0">
          <svg viewBox="0 0 24 24" class="w-4 h-4 text-brand" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </span>
        <span class="text-[13px] text-white/50">Profile</span>
      </div>
      <div class="h-px flex-1 bg-brand/30 max-w-[40px]"></div>
      <!-- Step 3 — active -->
      <div class="flex items-center gap-2.5 flex-1">
        <span class="w-7 h-7 rounded-full bg-brand flex items-center justify-center text-[12px] font-bold text-black font-display shrink-0">3</span>
        <span class="text-[13px] font-medium text-white">Photo</span>
      </div>
    </div>

    <!-- Card -->
    <div class="paper-stack bg-card rounded-2xl p-8 sm:p-10">
      <div class="mb-7 text-center">
        <span class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-brand/15 border border-brand/30 mb-5">
          <svg viewBox="0 0 24 24" class="w-6 h-6 text-brand" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </span>
        <h1 class="font-display font-bold text-[28px] leading-tight">Add a profile photo</h1>
        <p class="text-white/55 text-[14.5px] mt-2.5 leading-relaxed">Optional.</p>
      </div>

      <!-- Avatar upload zone -->
      <div class="flex flex-col items-center mb-8">
        <div
          id="avatarZone"
          class="avatar-zone flex items-center justify-center"
          tabindex="0"
          role="button"
          aria-label="Upload profile photo"
          onclick="document.getElementById('fileInput').click()"
          onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();document.getElementById('fileInput').click()}"
        >
          <!-- Placeholder bee icon -->
          <div id="placeholder" class="flex flex-col items-center gap-2">
            <svg viewBox="0 0 24 24" class="w-10 h-10 text-brand/50" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2 L20 6.5 L20 15.5 L12 20 L4 15.5 L4 6.5 Z"/>
              <path d="M12 9 L16 11 L16 14.5 L12 16.5 L8 14.5 L8 11 Z" fill="currentColor" fill-opacity="0.3" stroke="none"/>
            </svg>
          </div>
          <!-- Photo preview (hidden initially) -->
          <img id="preview" class="avatar-img hidden" alt="Profile photo preview" />
          <!-- Hover overlay for change -->
          <div class="avatar-overlay">
            <svg viewBox="0 0 24 24" class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
          </div>
        </div>
        <input
          id="fileInput"
          type="file"
          accept="image/*"
          class="hidden"
          onchange="handleFile(this)"
        />
        <button
          id="uploadLabel"
          onclick="document.getElementById('fileInput').click()"
          class="text-[13px] text-brand mt-4 hover:underline hover:underline-offset-4 transition-colors cursor-pointer bg-transparent border-0"
        >
          Click to upload
        </button>
        <span id="removeBtn" class="hidden text-[12px] text-white/40 mt-1.5 hover:text-white/70 cursor-pointer transition-colors" onclick="removePhoto()">Remove photo</span>
      </div>

      <!-- Buttons -->
      <div class="flex items-center gap-3">
        <button onclick="void 0" class="btn-primary rounded-full flex-1 px-5 py-3.5 text-[15px] inline-flex items-center justify-center gap-2">
          Finish setup
          <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </button>
        <button onclick="void 0" class="btn-ghost rounded-full px-5 py-3.5 text-[15px]">
          Skip for now
        </button>
      </div>
    </div>
  </div>
</main>

<!-- Footer -->
<footer class="relative z-10 py-6">
  <div class="max-w-7xl mx-auto px-6 lg:px-8 flex flex-wrap items-center justify-between gap-3 text-[12px] text-white/40">
    <div>&copy; 2026 Beehive Studio</div>
    <div class="flex items-center gap-5">
      <a href="#" class="hover:text-white/70">Privacy</a>
      <a href="#" class="hover:text-white/70">Terms</a>
      <span class="flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-green-400"></span>
        All systems honey
      </span>
    </div>
  </div>
</footer>

<script>
  function handleFile(input) {
    var file = input.files && input.files[0];
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function(e) {
      var preview = document.getElementById('preview');
      var placeholder = document.getElementById('placeholder');
      var zone = document.getElementById('avatarZone');
      var uploadLabel = document.getElementById('uploadLabel');
      var removeBtn = document.getElementById('removeBtn');

      preview.src = e.target.result;
      preview.classList.remove('hidden');
      placeholder.classList.add('hidden');
      zone.classList.add('has-photo');
      uploadLabel.textContent = 'Change photo';
      removeBtn.classList.remove('hidden');
    };
    reader.readAsDataURL(file);
  }

  function removePhoto() {
    var preview = document.getElementById('preview');
    var placeholder = document.getElementById('placeholder');
    var zone = document.getElementById('avatarZone');
    var uploadLabel = document.getElementById('uploadLabel');
    var removeBtn = document.getElementById('removeBtn');
    var fileInput = document.getElementById('fileInput');

    preview.src = '';
    preview.classList.add('hidden');
    placeholder.classList.remove('hidden');
    zone.classList.remove('has-photo');
    uploadLabel.textContent = 'Click to upload';
    removeBtn.classList.add('hidden');
    fileInput.value = '';
  }
</script>

</body>
</html>
