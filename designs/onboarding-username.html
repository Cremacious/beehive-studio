
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Choose your username — Beehive Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#141414', card: '#1c1c1c', elev: '#252525', inset: '#1e1e1e',
          line: '#2a2a2a', brand: '#FFC300', brandHi: '#FFD040', brandLo: '#e0ac01',
        },
        fontFamily: {
          display: ['Comfortaa', 'sans-serif'],
          sans: ['Geist', 'ui-sans-serif', 'system-ui', 'sans-serif'],
        },
        borderRadius: { xl: '14px', '2xl': '18px', '3xl': '22px' },
      }
    }
  }
</script>
<style>
  html, body { background: #141414; color: white; }
  body { font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .font-display { font-family: 'Comfortaa', sans-serif; }

  .paper-stack {
    border: 1px solid #2a2a2a;
    border-bottom-color: #111;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.04) inset,
      0 3px 0 rgba(0,0,0,0.32),
      0 40px 80px -40px rgba(0,0,0,0.6);
  }

  .hex-bg {
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='52' viewBox='0 0 60 52'><path d='M15 1 L45 1 L60 26 L45 51 L15 51 L0 26 Z' fill='none' stroke='%23FFC300' stroke-opacity='0.08' stroke-width='1'/></svg>");
    background-size: 60px 52px;
  }

  .auth-glow {
    background:
      radial-gradient(ellipse 50% 40% at 50% 30%, rgba(255,195,0,0.10), transparent 60%),
      radial-gradient(ellipse 60% 40% at 50% 80%, rgba(255,195,0,0.04), transparent 60%);
  }

  .field {
    background: #252525; border: 1px solid #2a2a2a; color: white;
    border-radius: 14px; padding: 14px 16px; width: 100%;
    transition: border-color .15s, box-shadow .15s;
    font-size: 15px;
  }
  .field::placeholder { color: rgba(255,255,255,0.3); }
  .field:focus { outline: none; border-color: rgba(255,195,0,0.5); box-shadow: 0 0 0 4px rgba(255,195,0,0.12); }
  .field.field-valid { border-color: rgba(74,222,128,0.5); }
  .field.field-valid:focus { box-shadow: 0 0 0 4px rgba(74,222,128,0.12); }
  .field.field-error { border-color: rgba(248,113,113,0.5); }
  .field.field-error:focus { box-shadow: 0 0 0 4px rgba(248,113,113,0.12); }

  .btn-primary {
    background: #FFC300; color: #0a0a0a; font-weight: 700; font-family: 'Comfortaa', sans-serif;
    transition: background-color .15s ease, transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    box-shadow: 0 6px 24px -10px rgba(255,195,0,0.55);
  }
  .btn-primary:hover:not(:disabled) { background: #FFD040; transform: translateY(-1px); }
  .btn-primary:active:not(:disabled) { background: #e0ac01; transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { animation: spin 0.7s linear infinite; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #FFC300; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body class="min-h-screen flex flex-col">

<!-- Backdrop -->
<div class="fixed inset-0 hex-bg opacity-50 pointer-events-none [mask-image:radial-gradient(ellipse_60%_50%_at_50%_40%,black,transparent_75%)]"></div>
<div class="fixed inset-0 auth-glow pointer-events-none"></div>

<!-- Top bar -->
<header class="relative z-10">
  <div class="max-w-7xl mx-auto px-6 lg:px-8 h-16 flex items-center justify-between">
    <a href="Landing Page.html" class="flex items-center gap-2.5">
      <span class="relative inline-flex items-center justify-center w-9 h-9 rounded-xl bg-brand/15 border border-brand/30">
        <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="#FFC300" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 L20 6.5 L20 15.5 L12 20 L4 15.5 L4 6.5 Z"/>
          <path d="M12 9 L16 11 L16 14.5 L12 16.5 L8 14.5 L8 11 Z" fill="#FFC300" fill-opacity="0.6" stroke="none"/>
        </svg>
      </span>
      <span class="font-display font-bold text-[17px] tracking-tight">Beehive Studio</span>
    </a>
    <span class="text-sm text-white/40">Step 1 of 3</span>
  </div>
</header>

<!-- Main -->
<main class="relative z-10 flex-1 flex items-center justify-center px-6 py-10">
  <div class="w-full max-w-md">

    <!-- Progress indicator -->
    <div class="flex items-center gap-2 mb-8 px-1">
      <!-- Step 1 — active -->
      <div class="flex items-center gap-2.5 flex-1">
        <span class="w-7 h-7 rounded-full bg-brand flex items-center justify-center text-[12px] font-bold text-black font-display shrink-0">1</span>
        <span class="text-[13px] font-medium text-white">Username</span>
      </div>
      <div class="h-px flex-1 bg-line max-w-[40px]"></div>
      <!-- Step 2 — upcoming -->
      <div class="flex items-center gap-2.5 flex-1">
        <span class="w-7 h-7 rounded-full border border-line bg-elev flex items-center justify-center text-[12px] font-medium text-white/40 font-display shrink-0">2</span>
        <span class="text-[13px] text-white/40">Profile</span>
      </div>
      <div class="h-px flex-1 bg-line max-w-[40px]"></div>
      <!-- Step 3 — upcoming -->
      <div class="flex items-center gap-2.5 flex-1">
        <span class="w-7 h-7 rounded-full border border-line bg-elev flex items-center justify-center text-[12px] font-medium text-white/40 font-display shrink-0">3</span>
        <span class="text-[13px] text-white/40">Preferences</span>
      </div>
    </div>

    <!-- Card -->
    <div class="paper-stack bg-card rounded-2xl p-8 sm:p-10">
      <div class="mb-7">
        <span class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-brand/15 border border-brand/30 mb-5">
          <svg viewBox="0 0 24 24" class="w-6 h-6 text-brand" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </span>
        <h1 class="font-display font-bold text-[28px] leading-tight">Choose your username</h1>
        <p class="text-white/55 text-[14.5px] mt-2.5 leading-relaxed">This is how other writers will find you.</p>
      </div>

      <form onsubmit="event.preventDefault();" class="space-y-4">
        <div>
          <label for="username" class="block text-[13px] font-medium text-white/80 mb-1.5">Username</label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-white/30 text-[15px] select-none pointer-events-none">@</span>
            <input
              id="username"
              type="text"
              autocomplete="username"
              spellcheck="false"
              autocapitalize="off"
              maxlength="24"
              placeholder="mayavance"
              class="field pl-9 pr-11"
              oninput="handleInput(this)"
            />
            <!-- Status icon container -->
            <div id="statusIcon" class="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 flex items-center justify-center">
            </div>
          </div>
          <!-- Feedback text -->
          <div id="feedback" class="mt-2 text-[12.5px] leading-snug min-h-[18px]"></div>
        </div>

        <button
          id="continueBtn"
          type="submit"
          disabled
          class="btn-primary rounded-full w-full px-5 py-3.5 text-[15px] inline-flex items-center justify-center gap-2 mt-2"
        >
          Continue
          <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </form>

      <!-- Hint -->
      <p class="text-white/35 text-[12px] mt-5 leading-relaxed text-center">
        3–24 characters. Letters, numbers, underscores only.
      </p>
    </div>
  </div>
</main>

<!-- Footer -->
<footer class="relative z-10 py-6">
  <div class="max-w-7xl mx-auto px-6 lg:px-8 flex flex-wrap items-center justify-between gap-3 text-[12px] text-white/40">
    <div>&copy; 2026 Beehive Studio</div>
    <div class="flex items-center gap-5">
      <a href="#" class="hover:text-white/70">Privacy</a>
      <a href="#" class="hover:text-white/70">Terms</a>
      <span class="flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-green-400"></span>
        All systems honey
      </span>
    </div>
  </div>
</footer>

<script>
  const taken = new Set(['beehive', 'admin', 'writer', 'maya', 'mayavance', 'rin', 'studio', 'support', 'help', 'test']);

  let debounceTimer = null;

  const input = document.getElementById('username');
  const statusIcon = document.getElementById('statusIcon');
  const feedback = document.getElementById('feedback');
  const btn = document.getElementById('continueBtn');

  function setState(state, msg) {
    input.classList.remove('field-valid', 'field-error');

    if (state === 'idle') {
      statusIcon.innerHTML = '';
      feedback.innerHTML = '';
      btn.disabled = true;
    } else if (state === 'checking') {
      statusIcon.innerHTML = '<svg class="w-5 h-5 text-white/40 spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 2v4"/><path d="M12 18v4" opacity=".3"/><path d="m4.93 4.93 2.83 2.83" opacity=".7"/><path d="m16.24 16.24 2.83 2.83" opacity=".2"/><path d="M2 12h4" opacity=".5"/><path d="M18 12h4" opacity=".1"/><path d="m4.93 19.07 2.83-2.83" opacity=".4"/><path d="m16.24 7.76 2.83-2.83" opacity=".6"/></svg>';
      feedback.innerHTML = '<span class="text-white/40">Checking availability\u2026</span>';
      btn.disabled = true;
    } else if (state === 'valid') {
      input.classList.add('field-valid');
      statusIcon.innerHTML = '<svg class="w-5 h-5 text-green-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
      feedback.innerHTML = '<span class="text-green-400">' + msg + '</span>';
      btn.disabled = false;
    } else if (state === 'error') {
      input.classList.add('field-error');
      statusIcon.innerHTML = '<svg class="w-5 h-5 text-red-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';
      feedback.innerHTML = '<span class="text-red-400">' + msg + '</span>';
      btn.disabled = true;
    }
  }

  function handleInput(el) {
    const val = el.value.trim();
    clearTimeout(debounceTimer);

    if (!val) { setState('idle'); return; }

    if (/[^a-zA-Z0-9_]/.test(val)) {
      setState('error', 'Only letters, numbers, and underscores allowed.');
      return;
    }
    if (val.length < 3) {
      setState('error', 'Must be at least 3 characters.');
      return;
    }

    setState('checking');
    debounceTimer = setTimeout(function() {
      var delay = 600 + Math.random() * 600;
      setTimeout(function() {
        if (input.value.trim().toLowerCase() !== val.toLowerCase()) return;
        if (taken.has(val.toLowerCase())) {
          setState('error', '@' + val + ' is already taken.');
        } else {
          setState('valid', '@' + val + ' is available!');
        }
      }, delay);
    }, 300);
  }
</script>

</body>
</html>
